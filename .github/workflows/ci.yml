name: InfraAtlas CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test and Build Go Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Run Go Vet Static Analysis
        run: go vet ./...

      - name: Verify Go Binary Compilation
        run: go build -v -o infraatlas .
